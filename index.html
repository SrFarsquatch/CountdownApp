<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3f0">
  <title>Countdown</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f3f0;
      --surface: #ffffff;
      --surface-muted: #f8f8f6;
      --text: #171717;
      --muted: #6b6b67;
      --border: #d8d8d3;
      --border-strong: #b9b9b2;
      --accent: #1f5eff;
      --danger: #b42318;
      --radius: 7px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #161616;
        --surface: #202020;
        --surface-muted: #262626;
        --text: #f3f3ef;
        --muted: #a4a49d;
        --border: #3a3a37;
        --border-strong: #565650;
        --accent: #7da2ff;
        --danger: #ff8a80;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-strong);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
    }

    .button:hover {
      border-color: var(--text);
    }

    .button.primary {
      border-color: var(--text);
      background: var(--text);
      color: var(--surface);
    }

    .button.text {
      min-height: auto;
      padding: 4px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }

    .button.text:hover {
      color: var(--text);
    }

    .button.danger {
      color: var(--danger);
    }

    .editor {
      display: none;
      margin-bottom: 28px;
      padding: 18px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .editor.open {
      display: block;
    }

    .editor-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .editor-head h2 {
      margin: 0;
      font-size: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field span {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface-muted);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    .status {
      margin: 10px 0 0;
      color: var(--muted);
      min-height: 1.25em;
      font-size: 0.88rem;
    }

    .list-head {
      display: grid;
      grid-template-columns: minmax(180px, 1.25fr) minmax(200px, 1fr) minmax(270px, 1.6fr) 84px;
      gap: 18px;
      padding: 0 14px 8px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .countdown-list {
      display: grid;
      gap: 8px;
    }

    .countdown-row {
      display: grid;
      grid-template-columns: minmax(180px, 1.25fr) minmax(200px, 1fr) minmax(270px, 1.6fr) 84px;
      gap: 18px;
      align-items: center;
      padding: 16px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .countdown-row.expired {
      opacity: 0.62;
    }

    .name {
      min-width: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .date {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .time {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-variant-numeric: tabular-nums;
    }

    .time-part {
      min-width: 0;
    }

    .time-value {
      display: block;
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .time-label {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .complete {
      grid-column: 1 / -1;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--muted);
      font-weight: 700;
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .empty {
      padding: 42px 20px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 1rem;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 24px, 980px);
        padding-top: 28px;
      }

      .header {
        align-items: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-actions .button {
        flex: 1;
      }

      .list-head {
        display: none;
      }

      .countdown-row {
        grid-template-columns: 1fr auto;
        gap: 14px 12px;
      }

      .date {
        grid-column: 1 / 2;
      }

      .time {
        grid-column: 1 / -1;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .row-actions {
        grid-column: 2 / 3;
        grid-row: 1 / 3;
        align-self: start;
        flex-direction: column;
      }
    }

    @media (max-width: 430px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .header .button.primary {
        width: 100%;
      }

      .countdown-row {
        grid-template-columns: 1fr;
      }

      .date,
      .time,
      .row-actions {
        grid-column: 1;
      }

      .row-actions {
        grid-row: auto;
        flex-direction: row;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand">
        <h1>Countdown</h1>
        <p>Keep the dates you care about in one place.</p>
      </div>
      <button id="newButton" class="button primary" type="button">New countdown</button>
    </header>

    <section id="editor" class="editor" aria-labelledby="editorTitle">
      <div class="editor-head">
        <h2 id="editorTitle">New countdown</h2>
        <button id="closeEditor" class="button text" type="button">Close</button>
      </div>

      <form id="countdownForm">
        <div class="form-grid">
          <label class="field">
            <span>Name</span>
            <input id="nameInput" type="text" maxlength="80" placeholder="Last day at work" required>
          </label>

          <label class="field">
            <span>End date and time</span>
            <input id="dateInput" type="datetime-local" required>
          </label>

          <div class="form-actions">
            <button id="saveButton" class="button primary" type="submit">Add</button>
            <button id="cancelButton" class="button" type="button">Cancel</button>
          </div>
        </div>
        <p id="formStatus" class="status" aria-live="polite"></p>
      </form>
    </section>

    <div class="list-head" aria-hidden="true">
      <div>Countdown</div>
      <div>End date</div>
      <div>Time remaining</div>
      <div></div>
    </div>

    <section id="countdownList" class="countdown-list" aria-live="polite"></section>

    <div id="emptyState" class="empty" hidden>
      <strong>No countdowns yet.</strong>
      Use “New countdown” to add one.
    </div>

    <p class="footer">Saved locally in this browser.</p>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'countdown-app-v2';
      var LEGACY_KEY = 'countdown-app-v1';
      var items = [];
      var editingId = null;
      var timer = null;

      var editor = document.getElementById('editor');
      var editorTitle = document.getElementById('editorTitle');
      var form = document.getElementById('countdownForm');
      var nameInput = document.getElementById('nameInput');
      var dateInput = document.getElementById('dateInput');
      var saveButton = document.getElementById('saveButton');
      var formStatus = document.getElementById('formStatus');
      var list = document.getElementById('countdownList');
      var emptyState = document.getElementById('emptyState');
      var newButton = document.getElementById('newButton');
      var closeEditor = document.getElementById('closeEditor');
      var cancelButton = document.getElementById('cancelButton');

      function createId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function pad(value) {
        return String(value).padStart(2, '0');
      }

      function toLocalInputValue(date) {
        var local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 16);
      }

      function defaultDateValue() {
        var date = new Date(Date.now() + 24 * 60 * 60 * 1000);
        date.setSeconds(0, 0);
        return toLocalInputValue(date);
      }

      function formatDate(iso) {
        var date = new Date(iso);
        return date.toLocaleString([], {
          weekday: 'short',
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function readStorage() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          if (Array.isArray(saved)) {
            items = saved.filter(function (item) {
              return item && item.id && item.name && item.end && !Number.isNaN(new Date(item.end).getTime());
            });
          }
        } catch (error) {
          items = [];
        }

        if (items.length === 0) {
          migrateLegacy();
        }
      }

      function migrateLegacy() {
        try {
          var legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
          if (!legacy || !legacy.end) return;

          var legacyDate = new Date(legacy.end);
          if (Number.isNaN(legacyDate.getTime())) return;

          items = [{
            id: createId(),
            name: String(legacy.name || 'My Countdown').trim() || 'My Countdown',
            end: legacyDate.toISOString(),
            created: new Date().toISOString()
          }];

          saveStorage();
          localStorage.removeItem(LEGACY_KEY);
        } catch (error) {
          return;
        }
      }

      function saveStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function sortItems() {
        items.sort(function (a, b) {
          var aTime = new Date(a.end).getTime();
          var bTime = new Date(b.end).getTime();
          var now = Date.now();
          var aExpired = aTime <= now;
          var bExpired = bTime <= now;

          if (aExpired !== bExpired) return aExpired ? 1 : -1;
          return aTime - bTime;
        });
      }

      function getRemaining(end) {
        var diff = new Date(end).getTime() - Date.now();

        if (diff <= 0) {
          return { expired: true, days: 0, hours: 0, minutes: 0, seconds: 0 };
        }

        var total = Math.floor(diff / 1000);
        return {
          expired: false,
          days: Math.floor(total / 86400),
          hours: Math.floor((total % 86400) / 3600),
          minutes: Math.floor((total % 3600) / 60),
          seconds: total % 60
        };
      }

      function makeTimePart(value, label) {
        var part = document.createElement('div');
        part.className = 'time-part';

        var number = document.createElement('span');
        number.className = 'time-value';
        number.textContent = value;

        var caption = document.createElement('span');
        caption.className = 'time-label';
        caption.textContent = label;

        part.appendChild(number);
        part.appendChild(caption);
        return part;
      }

      function render() {
        sortItems();
        list.innerHTML = '';

        emptyState.hidden = items.length !== 0;

        items.forEach(function (item) {
          var remaining = getRemaining(item.end);
          var row = document.createElement('article');
          row.className = 'countdown-row' + (remaining.expired ? ' expired' : '');

          var name = document.createElement('div');
          name.className = 'name';
          name.textContent = item.name;

          var date = document.createElement('div');
          date.className = 'date';
          date.textContent = formatDate(item.end);

          var time = document.createElement('div');
          time.className = 'time';

          if (remaining.expired) {
            var complete = document.createElement('div');
            complete.className = 'complete';
            complete.textContent = 'Complete';
            time.appendChild(complete);
          } else {
            time.appendChild(makeTimePart(String(remaining.days), 'days'));
            time.appendChild(makeTimePart(pad(remaining.hours), 'hours'));
            time.appendChild(makeTimePart(pad(remaining.minutes), 'min'));
            time.appendChild(makeTimePart(pad(remaining.seconds), 'sec'));
          }

          var actions = document.createElement('div');
          actions.className = 'row-actions';

          var edit = document.createElement('button');
          edit.type = 'button';
          edit.className = 'button text';
          edit.textContent = 'Edit';
          edit.addEventListener('click', function () {
            openEditor(item.id);
          });

          var remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'button text danger';
          remove.textContent = 'Delete';
          remove.addEventListener('click', function () {
            deleteItem(item.id);
          });

          actions.appendChild(edit);
          actions.appendChild(remove);

          row.appendChild(name);
          row.appendChild(date);
          row.appendChild(time);
          row.appendChild(actions);
          list.appendChild(row);
        });
      }

      function openEditor(id) {
        editingId = id || null;
        formStatus.textContent = '';

        if (editingId) {
          var item = items.find(function (entry) { return entry.id === editingId; });
          if (!item) return;

          editorTitle.textContent = 'Edit countdown';
          saveButton.textContent = 'Save';
          nameInput.value = item.name;
          dateInput.value = toLocalInputValue(new Date(item.end));
        } else {
          editorTitle.textContent = 'New countdown';
          saveButton.textContent = 'Add';
          nameInput.value = '';
          dateInput.value = defaultDateValue();
        }

        editor.classList.add('open');
        nameInput.focus();
      }

      function closeForm() {
        editingId = null;
        formStatus.textContent = '';
        editor.classList.remove('open');
      }

      function deleteItem(id) {
        var item = items.find(function (entry) { return entry.id === id; });
        if (!item) return;

        if (!window.confirm('Delete "' + item.name + '"?')) return;

        items = items.filter(function (entry) { return entry.id !== id; });
        saveStorage();

        if (editingId === id) closeForm();
        render();
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var name = nameInput.value.trim();
        var parsed = new Date(dateInput.value);

        if (!name) {
          formStatus.textContent = 'Enter a name.';
          nameInput.focus();
          return;
        }

        if (!dateInput.value || Number.isNaN(parsed.getTime())) {
          formStatus.textContent = 'Choose a valid date and time.';
          dateInput.focus();
          return;
        }

        if (editingId) {
          var existing = items.find(function (entry) { return entry.id === editingId; });
          if (!existing) {
            formStatus.textContent = 'That countdown could not be found.';
            return;
          }

          existing.name = name;
          existing.end = parsed.toISOString();
        } else {
          items.push({
            id: createId(),
            name: name,
            end: parsed.toISOString(),
            created: new Date().toISOString()
          });
        }

        saveStorage();
        closeForm();
        render();
      });

      newButton.addEventListener('click', function () {
        openEditor(null);
      });

      closeEditor.addEventListener('click', closeForm);
      cancelButton.addEventListener('click', closeForm);

      readStorage();
      render();

      timer = window.setInterval(render, 1000);

      window.addEventListener('beforeunload', function () {
        if (timer) window.clearInterval(timer);
      });
    })();
  </script>
</body>
</html>
