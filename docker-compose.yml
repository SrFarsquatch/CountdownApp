# CasaOS custom-install file.
# GitHub Actions builds and publishes the image from main.

name: countdownapp

services:
  countdown:
    image: ghcr.io/srfarsquatch/countdownapp:edge
    pull_policy: always
    container_name: countdownapp
    ports:
      - "8088:8080"
    environment:
      TZ: "America/Vancouver"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      APP_BASE_URL: "${APP_BASE_URL:-}"
      APP_SECRET: "${APP_SECRET:-}"
      DOCKER_SOCKET: "/var/run/docker.sock"
      CASAOS_RUNTIME_DIR: "/var/run/casaos"
      CASAOS_APP_ID: "countdownapp"
      TARGET_CONTAINER: "countdownapp"
      TARGET_IMAGE: "ghcr.io/srfarsquatch/countdownapp:edge"
    volumes:
      - type: bind
        source: /DATA/AppData/countdownapp/data
        target: /data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /var/run/casaos
        target: /var/run/casaos
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 192m
    mem_reservation: 32m
    cpus: "0.35"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    x-casaos:
      volumes:
        - container: /data
          description:
            en_US: Persistent CountdownApp data
        - container: /var/run/docker.sock
          description:
            en_US: Docker access used only when Update now is selected
      ports:
        - container: "8080"
          description:
            en_US: Planner web interface and FrameOS API

x-casaos:
  id: countdownapp
  store_app_id: countdownapp
  architectures:
    - amd64
    - arm64
  main: countdown
  category: Utilities
  developer: SrFarsquatch
  author: SrFarsquatch
  tagline:
    en_US: Self-hosted calendar, tasks, goals, countdowns and e-ink planner
  description:
    en_US: Plan your day with Google Calendar, tasks, goals, countdowns and flexible e-ink displays from a single CasaOS container.
  scheme: http
  port_map: "8088"
  index: /
  title:
    custom: Planner
    en_US: Countdown
  version: "edge"
