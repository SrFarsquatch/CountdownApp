<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Display</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}.page{padding:28px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:12px}.date{font-size:18px;font-weight:700}.title{font-size:38px;font-weight:800;letter-spacing:-.04em}.section{margin-top:26px}.label{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:8px}.next{font-size:30px;font-weight:800}.next small{display:block;font-size:16px;font-weight:600;margin-top:5px}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #bbb;padding:9px 0;font-size:18px}.row strong{font-weight:800}.muted{font-size:14px}.error{border:2px solid #000;padding:10px;margin-top:20px}
@media(max-width:600px){.page{padding:18px}.title{font-size:30px}.next{font-size:24px}}
</style></head><body><main class="page"><header class="top"><div class="title" id="title">Upcoming</div><div class="date" id="date"></div></header><div id="content"></div></main>
<script>
const token=new URLSearchParams(location.search).get("token");
const fmt=d=>new Date(d).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
async function load(){const r=await fetch("/api/frameos/feed?token="+encodeURIComponent(token||""));const data=await r.json();if(!r.ok){document.getElementById("content").innerHTML='<div class="error">'+(data.error||"Unable to load")+'</div>';return}document.getElementById("title").textContent=data.title||"Upcoming";document.getElementById("date").textContent=new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"});let html="";if(data.nextEvent){html+='<section class="section"><div class="label">Next</div><div class="next">'+esc(data.nextEvent.title)+'<small>'+fmt(data.nextEvent.start)+'</small></div></section>'}if(data.events.length){html+='<section class="section"><div class="label">Agenda</div>'+data.events.map(e=>'<div class="row"><span>'+esc(e.title)+'</span><strong>'+fmt(e.start)+'</strong></div>').join("")+'</section>'}if(data.countdowns.length){html+='<section class="section"><div class="label">Countdowns</div>'+data.countdowns.map(c=>'<div class="row"><span>'+esc(c.title)+'</span><strong>'+c.daysRemaining+'d</strong></div>').join("")+'</section>'}if(data.calendarError)html+='<div class="error muted">Calendar unavailable: '+esc(data.calendarError)+'</div>';document.getElementById("content").innerHTML=html||'<section class="section"><div class="label">Nothing upcoming</div></section>'}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}load();setInterval(load,300000);
</script></body></html>
