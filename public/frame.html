<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Countdown E-ink Display</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e8e3;font-family:Arial,Helvetica,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:12px}.frame{display:block;max-width:100%;max-height:calc(100vh - 24px);background:#fff;border:1px solid #999}.info{position:fixed;right:10px;bottom:8px;background:#fff;border:1px solid #bbb;padding:4px 7px;font-size:11px;color:#666}.error{background:#fff;border:2px solid #111;padding:18px;font-weight:700}</style></head>
<body><main class="wrap"><img id="frame" class="frame" alt="Countdown e-ink display"></main><div class="info" id="info"></div>
<script>
const q=new URLSearchParams(location.search),token=q.get('token')||'',w=Math.max(300,Math.min(2000,Number(q.get('w'))||800)),h=Math.max(300,Math.min(2000,Number(q.get('h'))||480)),img=document.getElementById('frame'),info=document.getElementById('info');
img.style.aspectRatio=w+'/'+h;
function refresh(){img.src='/api/frameos/image?token='+encodeURIComponent(token)+'&w='+w+'&h='+h+'&_='+Date.now()}
async function init(){try{const r=await fetch('/api/frameos/feed?token='+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load display');const m=Math.max(1,Number(d.display?.refreshMinutes)||15);info.textContent=w+' × '+h+' · refresh '+m+'m';refresh();setInterval(refresh,m*60000)}catch(e){document.querySelector('.wrap').innerHTML='<div class="error">'+String(e.message||e)+'</div>';info.remove()}}
init();
</script></body></html>
