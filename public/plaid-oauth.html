<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Returning to Quest Log</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
:root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f2ef;color:#242229;padding:24px}
main{width:min(420px,100%);background:#fff;border:1px solid #dedbd6;border-radius:18px;padding:28px;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.12)}
.mark{width:48px;height:48px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;background:#eeeafd;color:#6c5ce7;font-size:22px;font-weight:900}
h1{font-size:21px;margin:0 0 8px}p{margin:0;color:#69656e;line-height:1.5;font-size:14px}
button,a{margin-top:18px;display:inline-flex;min-height:42px;align-items:center;justify-content:center;border:0;border-radius:10px;padding:0 14px;background:#6c5ce7;color:#fff;text-decoration:none;font:inherit;font-weight:800}
#retry{display:none}
@media(prefers-color-scheme:dark){body{background:#1d1c20;color:#f4f1f7}main{background:#27252b;border-color:#3a3740}p{color:#b8b3be}.mark{background:#353047}}
</style>
</head>
<body>
<main>
  <div class="mark">Q</div>
  <h1 id="title">Returning to Quest Log</h1>
  <p id="status">Finishing your bank connection…</p>
  <a id="retry" href="/?view=markets">Back to Finance</a>
</main>
<script>
(()=>{
 const KEY='questlog.plaid.oauth';
 const title=document.getElementById('title'),status=document.getElementById('status'),retry=document.getElementById('retry');
 const finish=(ok,error='')=>{
   try{if(ok)localStorage.removeItem(KEY)}catch{}
   if(window.opener&&!window.opener.closed){
     try{window.opener.postMessage({type:'questlog-plaid-oauth-complete',ok,error},location.origin)}catch{}
     title.textContent=ok?'Connected':'Could not connect bank';
     status.textContent=ok?'Your bank is connected. You can close this window.':(error||'Return to Quest Log and try again.');
     if(!ok)retry.style.display='inline-flex';
     if(ok)setTimeout(()=>window.close(),500);
     return;
   }
   if(ok){location.replace('/?view=markets&plaid=connected');return}
   title.textContent='Could not connect bank';status.textContent=error||'Return to Quest Log and try again.';retry.style.display='inline-flex';
 };
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
 if(!saved?.linkToken){
   // Native Quest Log stores the Plaid session inside the app WebView, not the
   // external browser. Hand the exact HTTPS OAuth return URL back to the app
   // so Link can resume there with receivedRedirectUri.
   const deepLink='questlog://oauth/plaid?status=resume&redirect='+encodeURIComponent(location.href);
   title.textContent='Returning to Quest Log';
   status.textContent='Opening the Quest Log app to finish your bank connection…';
   retry.textContent='Open Quest Log';
   retry.href=deepLink;
   retry.style.display='inline-flex';
   setTimeout(()=>{location.href=deepLink},100);
   setTimeout(()=>{status.textContent='If Quest Log did not open automatically, tap the button below.'},1600);
   return;
 }
 if(saved.createdAt&&Date.now()-Number(saved.createdAt)>4*60*60*1000){
   try{localStorage.removeItem(KEY)}catch{}
   finish(false,'The Plaid session expired. Return to Finance and start again.');
   return;
 }
 // Desktop Link keeps control of its OAuth popup. Leave this page available
 // for the opener; mobile web/PWA must reinitialize Link here.
 if(window.opener&&!window.opener.closed){
   status.textContent='Finishing authorization with your bank…';
   return;
 }
 if(!window.Plaid){
   finish(false,'Plaid Link could not load. Check your connection and try again.');
   return;
 }
 let handler;
 try{
   handler=window.Plaid.create({
     token:saved.linkToken,
     receivedRedirectUri:window.location.href,
     onSuccess:async(publicToken,metadata)=>{
       try{
         const institution=metadata?.institution?{name:metadata.institution.name,institution_id:metadata.institution.institution_id}:null;
         const response=await fetch('/api/finance/exchange',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({publicToken,metadata:{institution}})});
         const data=await response.json().catch(()=>({}));
         if(!response.ok)throw new Error(data.error||'Quest Log could not save the bank connection.');
         finish(true);
       }catch(error){finish(false,error.message)}
       finally{handler?.destroy?.()}
     },
     onExit:(error,metadata)=>{
       const message=[error?.display_message,error?.error_message,error?.error_code,metadata?.error_code].filter(Boolean).join(' · ');
       finish(false,message||'Plaid Link was closed before the bank connection finished.');
       handler?.destroy?.();
     }
   });
   handler.open();
 }catch(error){finish(false,error.message||'Plaid OAuth could not resume.')}
})();
</script>
</body>
</html>
