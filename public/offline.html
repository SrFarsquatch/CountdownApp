<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5f5a52">
<title>Quest Log · Offline</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f2ef;color:#171717}
body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #dfddd7;border-radius:22px;padding:28px;box-shadow:0 16px 50px rgba(20,20,20,.08);text-align:center}
img{width:72px;height:72px;border-radius:18px}.eyebrow{margin-top:16px;font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:#77756f}
h1{margin:7px 0 8px;font-size:30px;letter-spacing:-.04em}p{margin:0;color:#77756f}button{margin-top:22px;border:0;border-radius:11px;padding:11px 16px;background:#5f5a52;color:#fff;font:inherit;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<main class="card">
<img src="/branding/icon-quest-192.png" alt="">
<div class="eyebrow">Quest Log</div>
<h1>You're offline.</h1>
<p>Quest Log keeps its planner data on your server or in Cloudflare D1, so reconnect to continue.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
