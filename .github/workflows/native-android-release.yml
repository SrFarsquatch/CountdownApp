name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Play Store version code
        required: true
        default: "1"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      NATIVE_BUILD_NUMBER: ${{ inputs.build_number }}
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Require Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npm run native:add:android

      - name: Add Firebase Android config
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build release bundle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Sign release bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/questlog-release.jks"
          jarsigner             -sigalg SHA256withRSA             -digestalg SHA-256             -keystore "$RUNNER_TEMP/questlog-release.jks"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             android/app/build/outputs/bundle/release/app-release.aab             "$ANDROID_KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-android-release-${{ inputs.build_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
