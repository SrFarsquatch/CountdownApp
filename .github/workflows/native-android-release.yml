name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional Android version code override
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-android-release.yml"
      - "public/**"
      - "native/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android build number
        shell: bash
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER=$((400000 + GITHUB_RUN_NUMBER))
          fi
          echo "NATIVE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_TAG=android-build-$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Detect release signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_SIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "Android release signing is configured."
          else
            echo "ANDROID_SIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "Android release signing is not configured; publishing an installable debug APK."
          fi

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npm run native:add:android

      - name: Add Firebase Android config
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build Android APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          if [ "$ANDROID_SIGNED_RELEASE" = "1" ]; then
            ./gradlew bundleRelease assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Prepare signed release outputs
        if: ${{ env.ANDROID_SIGNED_RELEASE == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/questlog-release.jks"

          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/QuestLog-Android.aab"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/questlog-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/QuestLog-Android.aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/QuestLog-Android.aab"

          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$RUNNER_TEMP/QuestLog-Android-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/questlog-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$RUNNER_TEMP/QuestLog-Android.apk" \
            "$RUNNER_TEMP/QuestLog-Android-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/QuestLog-Android.apk"

      - name: Prepare debug APK fallback
        if: ${{ env.ANDROID_SIGNED_RELEASE != '1' }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/QuestLog-Android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-android-${{ env.NATIVE_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/QuestLog-Android.apk
            ${{ runner.temp }}/QuestLog-Android.aab
          if-no-files-found: warn

      - name: Publish latest Android download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ANDROID_SIGNED_RELEASE" = "1" ]; then
            TITLE="Quest Log Android build $NATIVE_BUILD_NUMBER"
            NOTES="Signed Quest Log Android release. Download QuestLog-Android.apk for direct installation."
          else
            TITLE="Quest Log Android preview build $NATIVE_BUILD_NUMBER"
            NOTES="Installable Quest Log Android debug build. Release signing is not configured yet, so Android may require uninstalling an older build if its signing certificate differs."
          fi

          ASSETS=("$RUNNER_TEMP/QuestLog-Android.apk")
          if [ -f "$RUNNER_TEMP/QuestLog-Android.aab" ]; then
            ASSETS+=("$RUNNER_TEMP/QuestLog-Android.aab")
          fi

          gh release create "$ANDROID_RELEASE_TAG" \
            "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
