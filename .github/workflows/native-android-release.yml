name: Android release bundle

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional Android version code override
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-android-release.yml"
      - "native/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Android build number
        shell: bash
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            BUILD_NUMBER=$((400000 + GITHUB_RUN_NUMBER))
          fi
          echo "NATIVE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_TAG=android-build-$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Require Android signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npm run native:add:android

      - name: Add Firebase Android config
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build release bundle and APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Sign Android release outputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/questlog-release.jks"

          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/QuestLog-Android.aab"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/questlog-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$RUNNER_TEMP/QuestLog-Android.aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/QuestLog-Android.aab"

          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$RUNNER_TEMP/QuestLog-Android-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/questlog-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$RUNNER_TEMP/QuestLog-Android.apk" \
            "$RUNNER_TEMP/QuestLog-Android-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/QuestLog-Android.apk"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-android-release-${{ env.NATIVE_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/QuestLog-Android.apk
            ${{ runner.temp }}/QuestLog-Android.aab
          if-no-files-found: error

      - name: Publish latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$ANDROID_RELEASE_TAG" \
            "$RUNNER_TEMP/QuestLog-Android.apk" \
            "$RUNNER_TEMP/QuestLog-Android.aab" \
            --target "$GITHUB_SHA" \
            --title "Quest Log Android build $NATIVE_BUILD_NUMBER" \
            --notes "Signed Quest Log Android release. Download QuestLog-Android.apk for direct installation or QuestLog-Android.aab for Play Store distribution." \
            --latest
