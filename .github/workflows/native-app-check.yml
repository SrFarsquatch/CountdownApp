name: Native app check

on:
  push:
    branches:
      - native-capacitor
  pull_request:
    branches:
      - main

concurrency:
  group: native-app-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native:
    runs-on: ubuntu-latest
    env:
      ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build native web assets
        run: npm run native:prepare

      - name: Verify native boot overlay is initially hidden
        run: |
          grep -q 'id="nativeBootOverlay" hidden' native-web/index.html
          grep -q 'display:none;place-items:center' native-web/index.html
          ! grep -q 'id="nativeBootOverlay" hidden style="[^"]*display:grid' native-web/index.html

      - name: Verify native safe-area handling
        run: |
          grep -q 'html\[data-native-app="1"\] body:not(.planner-mode) .content' native-web/index.html
          grep -q 'padding-top:calc(18px + env(safe-area-inset-top, 0px))' native-web/index.html
          grep -q 'setOverlaysWebView({ overlay: false })' native-web/native-runtime.js

      - name: Verify social profile bundle
        run: |
          grep -q 'id="view-profile"' native-web/index.html
          grep -q "APP_VIEWS=new Set(\['today','profile'" native-web/index.html
          grep -q 'data-profile-user' native-web/index.html

      - name: Compile Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler/native-check

      - name: Generate Android project
        run: npm run native:add:android

      - name: Add Firebase Android config
        if: ${{ env.ANDROID_GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Verify Android native callback scheme
        run: |
          grep -q '<data android:scheme="questlog" />' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android:scheme="questlog" android:host="oauth"' android/app/src/main/AndroidManifest.xml

      - name: Verify Android Quest Log app link
        run: grep -q 'android:host="questlog.mattmoonie.ca"' android/app/src/main/AndroidManifest.xml

      - name: Verify Android push metadata
        run: |
          grep -q 'default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'questlog-updates' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/drawable/ic_stat_questlog.xml

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-ios-project:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npm run native:add:ios

      - name: Verify iOS OAuth callback
        run: grep -q '<string>questlog</string>' ios/App/App/Info.plist

      - name: Verify iOS Quest Log API domain
        run: grep -q '<string>questlog.mattmoonie.ca</string>' ios/App/App/Info.plist

      - name: Verify iOS status bar configuration
        run: grep -q '<key>UIViewControllerBasedStatusBarAppearance</key>' ios/App/App/Info.plist

      - name: Verify iOS Universal Links entitlement
        run: |
          grep -q 'applinks:questlog.mattmoonie.ca' ios/App/App/App.entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj

      - name: Verify iOS push registration hooks
        run: grep -q 'capacitorDidRegisterForRemoteNotifications' ios/App/App/AppDelegate.swift

      - name: Compile iOS Simulator app
        run: |
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Debug             -sdk iphonesimulator             -derivedDataPath "$RUNNER_TEMP/QuestLogDerivedData"             CODE_SIGNING_ALLOWED=NO             build
