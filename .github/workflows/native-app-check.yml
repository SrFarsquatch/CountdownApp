name: Native app check

on:
  push:
    branches:
      - native-capacitor
  pull_request:
    branches:
      - main

jobs:
  verify-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build native web assets
        run: npm run native:prepare

      - name: Compile Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler/native-check

      - name: Generate Android project
        run: npm run native:add:android

      - name: Verify Android OAuth callback
        run: grep -q 'android:scheme="questlog"' android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  verify-ios-project:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npm run native:add:ios

      - name: Verify iOS OAuth callback
        run: grep -q '<string>questlog</string>' ios/App/App/Info.plist

      - name: Verify iOS push registration hooks
        run: grep -q 'capacitorDidRegisterForRemoteNotifications' ios/App/App/AppDelegate.swift
